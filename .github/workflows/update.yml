name: Sync & Grow LTB Data

on:
  schedule:
    - cron: '0 6 1 * *'  # Runs monthly on the 1st
  workflow_dispatch:

permissions:
  contents: write  # Crucial: allows the action to push commits back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Upsert ETL Script
        run: python scripts/fetch_data.py

      - name: Commit and Push if records changed
        run: |
          git config --global user.name "LTB Data Bot"
          git config --global user.email "action@github.com"
          git add data/ltb_orders.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated monthly LTB data sync and backfill [skip ci]" && git push)