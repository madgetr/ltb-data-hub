name: Sync & Grow LTB Data

on:
  schedule:
    - cron: '0 6 1 * *'  # Runs monthly on the 1st
  workflow_dispatch:

permissions:
  contents: write  # Crucial: allows the action to push commits back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      - name: Run Upsert ETL Script
        run: python scripts/fetch_data.py

      - name: Run Geocode Lookup for Unknown Cities (Non-blocking)
        continue-on-error: true # Ensures workflow doesn't fail if an external lookup hiccup occurs
        run: python scripts/geocode_lookup.py

      - name: Commit and Push Updated Cache & Data
        run: |
          git config --global user.name "LTB Data Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          # Stage both the cache and the orders file explicitly
          git add data/city_coordinates_cache.csv data/ltb_orders.json || true
          
          # Check if there is actually anything staged to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update geocoding cache and LTB orders [skip ci]"
            git push
          fi